    fill="white" stroke="#2C2B3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Hair details -->
  <path d="M186 120c10-20 30-40 70-40 40 0 60 20 70 40 10 20 10 30 10 40 0 0-20-25-80-25s-80 25-80 25c0-10 0-20 10-40z" 
    fill="#2C2B3D" stroke="#2C2B3D" stroke-width="2" />
    
  <!-- Facial features - simplified -->
