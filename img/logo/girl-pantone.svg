<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pantone-inspired colors -->
  <defs>
    <linearGradient id="pantoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" /> <!-- Pantone Living Coral -->
      <stop offset="50%" style="stop-color:#F8A1D1;stop-opacity:1" /> <!-- Pantone Rose Quartz -->
      <stop offset="100%" style="stop-color:#A5DEE5;stop-opacity:1" /> <!-- Pantone Serenity -->
